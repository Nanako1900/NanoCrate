# NanoCrate 本地开发依赖(docs/backend.md §4/§5)。
# 放在 backend/ 根,使 `cd backend && docker compose up -d` 无需 -f 即可起。
name: nanocrate

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nanocrate-postgres
    environment:
      POSTGRES_USER: nano
      POSTGRES_PASSWORD: nano
      POSTGRES_DB: nanocrate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nano -d nanocrate"]
      interval: 5s
      timeout: 5s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: nanocrate-keycloak
    command: ["start-dev", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  nats:
    image: nats:2.10
    container_name: nanocrate-nats
    command: ["-js", "-m", "8222"]   # JetStream + 监控端口
    ports:
      - "4222:4222"
      - "8222:8222"

  # 可观测性栈(SPEC §9):trace → Jaeger;指标 → Prometheus + Grafana。
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: nanocrate-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC(API/worker 导出 trace 到这里)
      - "4318:4318"     # OTLP HTTP

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: nanocrate-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 抓取宿主机上 make run 的 API/worker
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: nanocrate-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_SECURITY_ADMIN_PASSWORD: "admin"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    ports:
      - "3001:3000"   # Grafana UI(避开前端 3000)

volumes:
  pgdata:
  grafanadata:
