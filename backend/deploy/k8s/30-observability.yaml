apiVersion: v1
kind: Service
metadata:
  name: nanocrate-jaeger
  namespace: nanocrate
spec:
  selector: { app: nanocrate-jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: 16686 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanocrate-jaeger
  namespace: nanocrate
spec:
  replicas: 1
  selector: { matchLabels: { app: nanocrate-jaeger } }
  template:
    metadata: { labels: { app: nanocrate-jaeger } }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env: [{ name: COLLECTOR_OTLP_ENABLED, value: "true" }]
          ports:
            - { containerPort: 16686 }
            - { containerPort: 4317 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nanocrate-prometheus
  namespace: nanocrate
data:
  prometheus.yml: |
    global: { scrape_interval: 15s }
    scrape_configs:
      - job_name: nanocrate-api
        static_configs: [{ targets: ["nanocrate-api:8080"] }]
      - job_name: nanocrate-worker
        static_configs: [{ targets: ["nanocrate-worker:9091"] }]
---
apiVersion: v1
kind: Service
metadata:
  name: nanocrate-prometheus
  namespace: nanocrate
spec:
  selector: { app: nanocrate-prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanocrate-prometheus
  namespace: nanocrate
spec:
  replicas: 1
  selector: { matchLabels: { app: nanocrate-prometheus } }
  template:
    metadata: { labels: { app: nanocrate-prometheus } }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.1
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{ containerPort: 9090 }]
          volumeMounts: [{ name: cfg, mountPath: /etc/prometheus }]
      volumes:
        - name: cfg
          configMap: { name: nanocrate-prometheus }
---
apiVersion: v1
kind: Service
metadata:
  name: nanocrate-grafana
  namespace: nanocrate
spec:
  selector: { app: nanocrate-grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanocrate-grafana
  namespace: nanocrate
spec:
  replicas: 1
  selector: { matchLabels: { app: nanocrate-grafana } }
  template:
    metadata: { labels: { app: nanocrate-grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Admin" }
          ports: [{ containerPort: 3000 }]
