apiVersion: v1
kind: Service
metadata:
  name: nanocrate-postgres
  namespace: nanocrate
spec:
  clusterIP: None
  selector: { app: nanocrate-postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nanocrate-postgres
  namespace: nanocrate
spec:
  serviceName: nanocrate-postgres
  replicas: 1
  selector: { matchLabels: { app: nanocrate-postgres } }
  template:
    metadata: { labels: { app: nanocrate-postgres } }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_USER, value: nano }
            - { name: POSTGRES_PASSWORD, value: nano }
            - { name: POSTGRES_DB, value: nanocrate }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "nano", "-d", "nanocrate"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
