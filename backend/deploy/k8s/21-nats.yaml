apiVersion: v1
kind: Service
metadata:
  name: nanocrate-nats
  namespace: nanocrate
spec:
  selector: { app: nanocrate-nats }
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
    - { name: monitor, port: 8222, targetPort: 8222 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nanocrate-nats
  namespace: nanocrate
spec:
  serviceName: nanocrate-nats
  replicas: 1
  selector: { matchLabels: { app: nanocrate-nats } }
  template:
    metadata: { labels: { app: nanocrate-nats } }
    spec:
      containers:
        - name: nats
          image: nats:2.10
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - { containerPort: 4222 }
            - { containerPort: 8222 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8222 }
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 1Gi } }
