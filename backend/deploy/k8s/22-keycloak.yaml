apiVersion: v1
kind: Service
metadata:
  name: nanocrate-keycloak
  namespace: nanocrate
spec:
  selector: { app: nanocrate-keycloak }
  ports: [{ port: 8081, targetPort: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanocrate-keycloak
  namespace: nanocrate
spec:
  replicas: 1
  selector: { matchLabels: { app: nanocrate-keycloak } }
  template:
    metadata: { labels: { app: nanocrate-keycloak } }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--http-port=8081"]
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - { name: KC_BOOTSTRAP_ADMIN_PASSWORD, value: admin }
            - { name: KC_HEALTH_ENABLED, value: "true" }
          ports: [{ containerPort: 8081 }]
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            initialDelaySeconds: 20
            periodSeconds: 10
# NOTE: dev-mode Keycloak. For production use start (not start-dev), a managed DB,
# a configured realm, and TLS.
