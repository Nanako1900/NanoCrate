# Prometheus scrape config for NanoCrate (SPEC §9).
# The API and worker run on the host (make run / make worker); Prometheus reaches
# them via host.docker.internal.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: nanocrate-api
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels: { service: nanocrate-api }

  - job_name: nanocrate-worker
    static_configs:
      - targets: ["host.docker.internal:9091"]
        labels: { service: nanocrate-worker }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
