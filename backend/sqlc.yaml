version: "2"
sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries/catalog.sql"
    gen:
      go:
        package: "catalogdb"
        out: "internal/catalog/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        json_tags_case_style: "snake"
        overrides: &type_overrides
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "vector"
            nullable: true
            go_type:
              import: "github.com/pgvector/pgvector-go"
              package: "pgvector"
              type: "Vector"
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries/inventory.sql"
    gen:
      go:
        package: "invdb"
        out: "internal/inventory/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        json_tags_case_style: "snake"
        overrides: *type_overrides
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries/cart.sql"
    gen:
      go:
        package: "cartdb"
        out: "internal/cart/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        json_tags_case_style: "snake"
        overrides: *type_overrides
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries/order.sql"
    gen:
      go:
        package: "orderdb"
        out: "internal/order/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        json_tags_case_style: "snake"
        overrides: *type_overrides
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries/events.sql"
    gen:
      go:
        package: "eventsdb"
        out: "internal/events/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        json_tags_case_style: "snake"
        overrides: *type_overrides
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/queries/admin.sql"
    gen:
      go:
        package: "admindb"
        out: "internal/admin/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        json_tags_case_style: "snake"
        overrides: *type_overrides
